name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Run unit and Forge bridge integration tests
        run: gradle --no-daemon clean test
      - name: Build all modules
        run: gradle --no-daemon build
      - name: Build runtime and fixture JARs
        run: gradle --no-daemon :mom-fabric-1201:remapJar :mom-fabric-1201:forgeFixtureJar
      - name: Smoke test Minecraft client with Forge fixture
        shell: bash
        run: |
          command -v xvfb-run
          mkdir -p mom-fabric-1201/run/config/mom/forge-mods
          cp mom-fabric-1201/build/libs/*-forge-fixture.jar mom-fabric-1201/run/config/mom/forge-mods/
          set +e
          timeout --signal=TERM --kill-after=10s 90s xvfb-run -a gradle --no-daemon :mom-fabric-1201:runClient > /tmp/mom-run-client.log 2>&1
          status=$?
          set -e
          cat /tmp/mom-run-client.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          grep -F "[MOM/Forge] Constructed momfixture" /tmp/mom-run-client.log
          grep -F "[MOM/Forge] Loaded 1 Forge-style mod(s)" /tmp/mom-run-client.log
      - name: Upload runtime and fixture JARs
        uses: actions/upload-artifact@v4
        with:
          name: mom-1.20.1-runtime-and-fixture
          path: |
            mom-fabric-1201/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
