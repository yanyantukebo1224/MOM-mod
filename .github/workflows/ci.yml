name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Run unit and Forge bridge integration tests
        run: gradle --no-daemon clean test
      - name: Build all modules
        run: gradle --no-daemon build
      - name: Build runtime and fixture JARs
        run: gradle --no-daemon :mom-fabric-1201:remapJar :mom-fabric-1201:forgeFixtureJar
      - name: Upload runtime and fixture JARs
        uses: actions/upload-artifact@v4
        with:
          name: mom-1.20.1-runtime-and-fixture
          path: |
            mom-fabric-1201/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
